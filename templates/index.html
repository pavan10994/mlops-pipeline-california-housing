<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>California Housing Price Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">California Housing Price Predictor</h2>
        <div class="card p-4 shadow-sm">
            <form action="/predict" method="post">
                <div class="row g-3">
                    <div class="col-md-4"><label class="form-label">Longitude</label><input type="number" step="any" name="longitude" class="form-control" value="-122.23" required></div>
                    <div class="col-md-4"><label class="form-label">Latitude</label><input type="number" step="any" name="latitude" class="form-control" value="37.88" required></div>
                    <div class="col-md-4"><label class="form-label">Housing Median Age</label><input type="number" step="any" name="housing_median_age" class="form-control" value="41" required></div>
                    <div class="col-md-4"><label class="form-label">Total Rooms</label><input type="number" step="any" name="total_rooms" class="form-control" value="880" required></div>
                    <div class="col-md-4"><label class="form-label">Total Bedrooms</label><input type="number" step="any" name="total_bedrooms" class="form-control" value="129" required></div>
                    <div class="col-md-4"><label class="form-label">Population</label><input type="number" step="any" name="population" class="form-control" value="322" required></div>
                    <div class="col-md-4"><label class="form-label">Households</label><input type="number" step="any" name="households" class="form-control" value="126" required></div>
                    <div class="col-md-4"><label class="form-label">Median Income</label><input type="number" step="any" name="median_income" class="form-control" value="8.3252" required></div>
                    <div class="col-md-4">
                        <label class="form-label">Ocean Proximity</label>
                        <select name="ocean_proximity" class="form-select">
                            <option value="NEAR BAY">NEAR BAY</option>
                            <option value="<1H OCEAN">&lt;1H OCEAN</option>
                            <option value="INLAND">INLAND</option>
                            <option value="NEAR OCEAN">NEAR OCEAN</option>
                            <option value="ISLAND">ISLAND</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-4">Predict House Price</button>
            </form>

            {% if prediction %}
            <div class="alert alert-success mt-4 text-center">
                <h4>Predicted Median House Value: ${{ prediction }}</h4>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
